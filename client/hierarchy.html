<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataProcessor System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/hierarchy.css">
</head>
<body>

<div class="main-panel">
    <header class="header">
        <a href="/" class="home-btn">🏠</a>
        <h1>Иерархия и модели</h1>
        <div></div>
    </header>

    <main class="content-area">
        <div id="tab-hierarchy" class="tab-content active">

            <div class="block-container">
                <div class="block-title">1. Загрузка данных</div>
                <div class="upload-area">
                    <p style="margin-bottom: 15px; color: var(--text-light);">Загрузите Excel файл с данными</p>
                    <input type="file" id="fileInput" accept=".xlsx, .xls"/>
                    <button class="btn" onclick="document.getElementById('fileInput').click()">Выбрать файл</button>
                    <button class="btn btn-outline" onclick="uploadFile()">Загрузить данные</button>
                    <span id="fileName" style="margin-left: 15px; color: var(--text-light); font-style: italic;"></span>
                </div>
            </div>

            <div class="block-container" id="normalize-block">
                <div class="block-title">2. Нормализация</div>
                <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 15px;">
                    ℹ️ Правила нормализации (ГОСТ 8.417, ГОСТ 2.321) встроены в систему.
                </p>
                <div class="controls">
                    <button class="btn btn-warning" onclick="runNormalization()">Выполнить нормализацию</button>
                </div>
                <div class="controls">
                    <button class="btn btn-warning" onclick="">Загрузить правила нормализации</button>
                </div>
            </div>

            <div class="block-container" id="edit-block">
                <div class="block-title">3. Результат</div>
                <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px;">
                    <select id="historySelect" style="flex:1; min-width:200px;">
                        <option value="">— Выбрать предыдущий результат —</option>
                    </select>
                    <button class="btn btn-outline" id="clearHistoryBtn">🗑 Очистить</button>
                </div>
                <div class="controls">
                    <div>
                        <span style="font-weight: 500; color: var(--text-light);">ℹ️ Нажмите правой кнопкой мыши на ячейку для действий</span>
                    </div>
                    <div>
                        <button class="btn btn-success" onclick="saveAndDownload()">Скачать CSV</button>
                        <button class="btn" style="background: #3b82f6;" onclick="saveAndDownloadJSON()">Скачать JSON
                        </button>
                    </div>
                </div>
                <div class="table-container" id="view-table">
                    <div style="text-align:center; padding:40px; color: var(--text-light);">Нет предыдущих записей</div>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="status-message"></div>
<div id="contextMenu" class="context-menu"></div>

<script src="/assets/js/utils.js"></script>
<script src="/assets/js/hierarchy.js"></script>
</body>
</html>
